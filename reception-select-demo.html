<script>
/* ブラウザデモ用 webxdc モック: 同一ブラウザの複数タブ間で更新を共有します */
(function(){
  var KEY="webxdc_demo_updates", ch=null, listener=null, lastSerial=0;
  try{ch=new BroadcastChannel("webxdc_demo")}catch(e){}
  var mem=[];
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return mem}}
  function save(a){mem=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
  var id;try{id=sessionStorage.getItem("demo_id");if(!id){id=Math.random().toString(36).slice(2,6);sessionStorage.setItem("demo_id",id)}}catch(e){id=Math.random().toString(36).slice(2,6)}
  function deliver(){
    if(!listener)return;
    var a=load();
    while(lastSerial<a.length){var u=a[lastSerial];lastSerial++;
      listener({payload:u.payload,serial:lastSerial,max_serial:a.length,info:u.info})}
  }
  window.webxdc={
    selfAddr:"demo-"+id+"@example.invalid",
    selfName:"Staff-"+id.toUpperCase(),
    sendUpdate:function(up){
      var a=load();a.push({payload:up.payload,info:up.info});save(a);
      if(ch)ch.postMessage(1);
      deliver();
    },
    setUpdateListener:function(cb,serial){
      listener=cb;lastSerial=serial||0;deliver();
      return Promise.resolve();
    }
  };
  if(ch)ch.onmessage=deliver;
  window.addEventListener("storage",function(e){if(e.key===KEY)deliver()});
})();
</script>

(function(){
  var VERSION="2026.10.14-c", COOLDOWN_MS=10000, ESCALATE_MS=60000, KEEP=20, REQUIRE_NAME=false, LOG_TO_CHAT=true, DEFAULT_PASSWORD="secret", ORG="ja";

  var sel=$("lang");Object.keys(NAMES).forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=NAMES[c];sel.appendChild(o)});

  // 呼び鈴
  var CHIMES={pingpong:[[988,0,.55],[784,.5,1.3]],double:[[988,0,.4],[784,.4,.5],[988,1.1,.4],[784,1.5,1.1]],chime:[[659,0,.6],[523,.5,.6],[587,1,.6],[392,1.5,1.4]],bell:[[1175,0,2.2]],soft:[[740,0,.6],[587,.55,1.4]],off:[]};
  var actx=null;
  function playChime(type,vol){
    type=type||store("chtype")||"pingpong";if(type==="off")return;

    try{
      var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      actx=actx||new AC();if(actx.resume)actx.resume();
      var now=actx.currentTime+0.02,master=actx.createGain();master.gain.value=Math.max(0,Math.min(1,vol));master.connect(actx.destination);
      (CHIMES[type]||CHIMES.pingpong).forEach(function(n){
        [[1,1],[2,.25],[3,.08]].forEach(function(h){
          var o=actx.createOscillator(),g=actx.createGain(),t0=now+n[1];
          o.type="sine";o.frequency.value=n[0]*h[0];
          g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(.45*h[1],t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+n[2]);

    $("chTitle").textContent=adm("chime");$("chTypeL").textContent=adm("chType");$("chVolL").textContent=adm("chVol");$("chTest").textContent="▶ "+adm("chTest");
  }
  $("chType").onchange=function(){store("chtype",$("chType").value);playChime()};
  $("chVol").onchange=function(){store("chvol",$("chVol").value);playChime()};
  $("chTest").onclick=function(){playChime($("chType").value,parseFloat($("chVol").value))};

  // パスワード
  function askPw(title,cb,noInput){$("pwTitle").textContent=title;$("pwIn").value="";$("pwIn").classList.toggle("hidden",!!noInput);$("pwErr").textContent="";$("pw").classList.remove("hidden");pwCb=cb;if(!noInput)$("pwIn").focus()}
  function closePw(){$("pw").classList.add("hidden");pwCb=null}
  $("pwCancel").onclick=closePw;
  $("pwOk").onclick=function(){var cb=pwCb;if(!cb)return;var r=cb($("pwIn").value);if(r)$("pwErr").textContent=r;else if(pwCb===cb)closePw()};
  $("pwIn").onkeydown=function(e){if(e.key==="Enter")$("pwOk").click()};
  $("modeBtn").onclick=function(){
    if(getMode()==="reception"){askPw(t("pwPrompt"),function(v){if(v!==getPw())return t("pwWrong");setMode("staff")});return}
    askPw(adm("confirmRecep"),function(){setMode("reception")},true);
  };
  $("pwChange").onclick=function(){
    $("pwNote").textContent="";
    askPw(adm("pwCur"),function(v){
      if(v!==getPw())return t("pwWrong");
      askPw(adm("pwNew"),function(n){if(n.length<4)return adm("pwShort");store("pw",n);$("pwNote").textContent=adm("pwChanged")});
    });
  };

  // 担当者登録
  function sendReg(on){store("reg",on?"1":"0");webxdc.sendUpdate({payload:{type:"register",addr:selfAddr,name:selfName,lang:lang,on:on}},"register")}
  $("regBtn").onclick=function(){sendReg(!staff[selfAddr])};

  // 呼出し
  function choose(to,toName){pending={to:to,toName:toName};$("toLabel").textContent=t("toWho",{who:to==="*"?t("allStaff"):t("person",{n:toName})});$("pick").classList.add("hidden");$("pickTitle").classList.add("hidden");$("form").classList.remove("hidden");$("vname").value="";$("msg").textContent="";$("vname").focus()}
  function closeForm(){pending=null;$("form").classList.add("hidden");$("pick").classList.remove("hidden");$("pickTitle").classList.remove("hidden")}
  $("backBtn").onclick=closeForm;
  $("allBtn").onclick=function(){choose("*","")};
  $("goBtn").onclick=function(){var v=$("vname").value.replace(/\s+/g," ").trim();if(REQUIRE_NAME&&!v){$("vname").focus();return}var p=pending;closeForm();callTo(p.to,p.toName,v)};
  function showMsg(x,c){var m=$("msg");m.textContent=x;m.className=c||""}
  function callTo(to,toName,visitor){
    var now=Date.now();
    if(now-lastPress<COOLDOWN_MS){showMsg(t("cooldown"),"done");return}
    lastPress=now;visitor=visitor||"";
    var id=now+"-"+Math.random().toString(36).slice(2,6), vtag=visitor?"【"+visitor+"】":"";
    myCallId=id;
    function msg(l){return"📞 "+tr(l,to==="*"?"nAll":"nYou")+vtag+" ("+tr(l,"nCall")+")"}
    var notify={};
    if(to==="*"){Object.keys(staff).forEach(function(a){if(a!==selfAddr)notify[a]=msg(langOf(a))});notify["*"]=msg(ORG)}
    else notify[to]=msg(langOf(to));
    var who=to==="*"?t("allStaff"):t("person",{n:toName});
    try{
      var up={payload:{type:"call",id:id,time:now,addr:selfAddr,to:to,toName:toName||"",visitor:visitor},notify:notify};
      if(LOG_TO_CHAT)up.info="来客："+(visitor||"（名前の入力なし）")+" → "+(to==="*"?"全員宛":toName+"さん宛");
      webxdc.sendUpdate(up,"call");
      playChime();
      showMsg(t("sent",{who:who}),"done");
      if(to!=="*"){
        setTimeout(function(){
          var c=calls[id];if(c&&c.claimedBy)return;
          var n2={};n2["*"]="📞 "+tr(ORG,"nAll")+vtag+" ("+tr(ORG,"nEsc",{who:tr(ORG,"person",{n:toName})})+")";
          Object.keys(staff).forEach(function(a){if(a!==selfAddr)n2[a]="📞 "+tr(langOf(a),"nAll")+vtag+" ("+tr(langOf(a),"nEsc",{who:tr(langOf(a),"person",{n:toName})})+")"});
          webxdc.sendUpdate({payload:{type:"escalate",id:id},info:LOG_TO_CHAT?"再通知："+toName+"さんが応答しないため、全員に通知しました":undefined,notify:n2},"escalate");
        },ESCALATE_MS);
      }
    }catch(e){lastPress=0;showMsg(t("err"),"err")}
  }
  function claim(id){webxdc.sendUpdate({payload:{type:"claim",id:id,name:selfName},info:selfName+"さんが対応します"},"claim")}

  var pr=webxdc.setUpdateListener(function(u){
    var p=u.payload||{},c;
    if(p.type==="register"){if(p.on)staff[p.addr]={addr:p.addr,name:p.name,lang:p.lang};else delete staff[p.addr]}
    else if(p.type==="call"){c=calls[p.id]=calls[p.id]||{id:p.id,claimedBy:null};c.time=p.time;c.from=p.addr;c.to=p.to;c.toName=p.toName;c.visitor=p.visitor||""}
    else if(p.type==="claim"){c=calls[p.id]=calls[p.id]||{id:p.id,claimedBy:null};if(!c.claimedBy)c.claimedBy=p.name;if(p.id===myCallId&&getMode()==="reception")showMsg(t("claimed",{n:c.claimedBy}),"done")}
    else if(p.type==="escalate"){c=calls[p.id]=calls[p.id]||{id:p.id,claimedBy:null};c.escalated=true}
    render();
  },0);
  // 登録が失われていたら自動で再登録（受信の取りこぼし対策）
  function heal(){if(store("reg")==="1"&&getMode()==="staff"&&!staff[selfAddr])sendReg(true)}
  if(pr&&pr.then)pr.then(heal);else setTimeout(heal,3000);

  function hhmm(ms){if(!ms)return"--:--";var d=new Date(ms);return("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
  function render(){
    if(!lang)return;
    var m=getMode();
    $("reception").classList.toggle("hidden",m!=="reception");$("staff").classList.toggle("hidden",m!=="staff");
    $("modeBtn").textContent=m==="reception"?t("toStaff"):t("toRecep");
    $("ver").textContent="v"+VERSION;
    if(m==="reception"){
      var g=$("grid");g.innerHTML="";$("noStaff").textContent=adm("noStaff");$("noStaff").classList.toggle("hidden",Object.keys(staff).length>0);
      Object.keys(staff).map(function(k){return staff[k]}).sort(function(a,b){return a.name<b.name?-1:1}).forEach(function(s){
        var b=document.createElement("button");b.type="button";b.className="staffBtn";b.textContent=s.name;b.onclick=function(){choose(s.addr,s.name)};g.appendChild(b)});
      return;
    }
    var reg=!!staff[selfAddr];
    $("regState").textContent=reg?t("regOn"):t("regOff");$("regBtn").textContent=reg?t("regBtnOff"):t("regBtnOn");$("regBtn").className=reg?"off":"";
    $("regList").textContent=adm("regList")+": "+(Object.keys(staff).map(function(k){return staff[k].name}).join(", ")||"-");
    var arr=Object.keys(calls).map(function(k){return calls[k]}).sort(function(a,b){return(b.time||0)-(a.time||0)}).slice(0,KEEP);
    var list=$("list");list.innerHTML="";
    if(!arr.length){var e=document.createElement("div");e.className="empty";e.textContent=t("none");list.appendChild(e);return}
    arr.forEach(function(c){
      var mine=!c.claimedBy&&c.to===selfAddr;
      var d=document.createElement("div");d.className="item"+(c.claimedBy?"":(mine?" mine":" open"));
      var l=document.createElement("div"),tt=document.createElement("div"),s=document.createElement("div");
      tt.className="t";tt.textContent=t("visit",{t:hhmm(c.time)})+(mine?" "+t("toYou"):"");l.appendChild(tt);
      if(c.visitor){var v=document.createElement("div");v.className="v";v.textContent=t("visitor",{v:c.visitor});l.appendChild(v)}
      s.className="s";
      var tg=(c.to==="*"||!c.to)?t("forAll"):t("forP",{n:c.toName});
      s.textContent=c.claimedBy?t("claimedBy",{n:c.claimedBy}):(tg+" · "+t("open")+(c.escalated?"\n"+t("esc"):""));
      if(c.claimedBy===selfName)s.textContent+="\n"+t("hint");
      l.appendChild(s);d.appendChild(l);
      if(!c.claimedBy){var b=document.createElement("button");b.type="button";b.textContent=t("claim");b.onclick=function(){claim(c.id)};d.appendChild(b)}
      list.appendChild(d);
    });
  }
  setLang(store("lang")&&L[store("lang")]?store("lang"):detect());
})();
</script>
</body>
</html>
